# Branch protection setup (GitHub repo Settings → Branches → Add rule):
# - Branch name pattern: main
# - Require status checks: unit-tests, contract-tests, security
# - Require branches to be up to date before merging
# - integration-tests is advisory only (runs on main push + PRs to main)
name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum
            go.work.sum

      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          wait_for_healthy() {
            local service="$1"
            local max_attempts=60
            local attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              local container_id
              container_id="$(docker compose -f docker-compose.test.yml ps -q "$service")"
              if [ -n "$container_id" ]; then
                local status
                status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' "$container_id")"
                if [ "$status" = "healthy" ]; then
                  return 0
                fi
              fi
              sleep 1
              attempt=$((attempt + 1))
            done
            echo "service '$service' did not become healthy" >&2
            return 1
          }
          wait_for_healthy postgres
          wait_for_healthy redis

      - name: Backend tests with coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5433/testdb?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6380
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: |
          cd backend
          go test ./... -race -coverprofile=backend-coverage.out -covermode=atomic

      - name: Enforce coverage floor
        run: bash scripts/coverage-report.sh

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/backend-coverage.out

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum
            go.work.sum

      - name: Run golangci-lint
        run: |
          cd backend
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build production image
        run: |
          cd backend
          docker build -t test-backend .

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum
            go.work.sum

      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          wait_for_healthy() {
            local service="$1"
            local max_attempts=60
            local attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              local container_id
              container_id="$(docker compose -f docker-compose.test.yml ps -q "$service")"
              if [ -n "$container_id" ]; then
                local status
                status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' "$container_id")"
                if [ "$status" = "healthy" ]; then
                  return 0
                fi
              fi
              sleep 1
              attempt=$((attempt + 1))
            done
            echo "service '$service' did not become healthy" >&2
            return 1
          }
          wait_for_healthy postgres
          wait_for_healthy redis

      - name: Validate OpenAPI
        run: |
          cd backend
          bash scripts/validate-openapi.sh

      - name: Run backend contract tests
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5433/testdb?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6380
        run: go test ./backend/internal/contract/...

      - name: Protect service contracts (additive-only)
        if: github.event_name == 'pull_request'
        run: bash scripts/protect-contract-tests.sh "origin/${{ github.base_ref }}"

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down

  integration-tests:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum
            go.work.sum

      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          wait_for_healthy() {
            local service="$1"
            local max_attempts=60
            local attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              local container_id
              container_id="$(docker compose -f docker-compose.test.yml ps -q "$service")"
              if [ -n "$container_id" ]; then
                local status
                status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' "$container_id")"
                if [ "$status" = "healthy" ]; then
                  return 0
                fi
              fi
              sleep 1
              attempt=$((attempt + 1))
            done
            echo "service '$service' did not become healthy" >&2
            return 1
          }
          wait_for_healthy postgres
          wait_for_healthy redis

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5433/testdb?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6380
        run: go test -tags integration ./backend/internal/integration/...

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum
            go.work.sum

      - name: Install and run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -exclude-dir=backend/.gopath -exclude-dir=backend/.gomodcache -exclude-dir=backend/.gocache ./backend/...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" -C backend ./...

      - name: Secret scanning
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          "$(go env GOPATH)/bin/gitleaks" detect --source . --verbose --redact

      - name: Verify security headers on /healthz
        env:
          STAGE_STATUS: dev
          SERVER_HOST: 127.0.0.1
          SERVER_PORT: 5000
          SERVER_READ_TIMEOUT: 30
          SERVER_WRITE_TIMEOUT: 30
          SERVER_IDLE_TIMEOUT: 60
          LOGGER_LEVEL: error
          LOGGER_PRETTY: false
          DB_ENABLE: true
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_USER: postgres
          DB_PASSWORD: test
          DB_NAME: testdb
          DB_SSL_MODE: disable
          DB_TIMEZONE: UTC
          REDIS_ENABLE: true
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6380
          REDIS_PASSWORD: ""
          REDIS_DB: 0
          JWT_SECRET: ci-test-secret-not-for-production
        run: |
          set -euo pipefail
          docker compose -f docker-compose.test.yml up -d

          wait_for_healthy() {
            local service="$1"
            local max_attempts=60
            local attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              local container_id
              container_id="$(docker compose -f docker-compose.test.yml ps -q "$service")"
              if [ -n "$container_id" ]; then
                local status
                status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' "$container_id")"
                if [ "$status" = "healthy" ]; then
                  return 0
                fi
              fi
              sleep 1
              attempt=$((attempt + 1))
            done
            echo "service '$service' did not become healthy" >&2
            return 1
          }

          wait_for_healthy postgres
          wait_for_healthy redis

          pushd backend >/dev/null
          go run . >/tmp/backend.log 2>&1 &
          backend_pid=$!
          popd >/dev/null

          cleanup() {
            kill "$backend_pid" >/dev/null 2>&1 || true
            docker compose -f docker-compose.test.yml down
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          cat /tmp/backend.log || true

          headers="$(curl -sS -D - -o /dev/null http://127.0.0.1:5000/healthz)"

          echo "$headers" | grep -qi '^X-Content-Type-Options:'
          echo "$headers" | grep -qi '^X-Frame-Options:'
          echo "$headers" | grep -qi '^X-XSS-Protection:'
          echo "$headers" | grep -qi '^Content-Security-Policy:'

  mutation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum
            go.work.sum

      - name: Kill mutations in stable core logic
        run: bash scripts/mutation-test.sh
